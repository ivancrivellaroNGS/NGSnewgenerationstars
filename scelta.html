<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGS - Select Your Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body { 
            background-color: #010002; 
            color: #ffffff; 
            font-family: 'Poppins', sans-serif; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
            position: relative;
        }

        /* SFONDO DINAMICO CON AURE LED ROSSE DAI BORDI VERSO IL CENTRO */
        .selection-container {
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center;
            background: 
                /* LED Rosso da Sinistra verso il centro */
                radial-gradient(ellipse 50% 80% at 0% 50%, rgba(255, 0, 43, 0.85) 0%, rgba(150, 0, 20, 0.4) 40%, transparent 75%),
                /* LED Rosso da Destra verso il centro */
                radial-gradient(ellipse 50% 80% at 100% 50%, rgba(255, 0, 43, 0.85) 0%, rgba(150, 0, 20, 0.4) 40%, transparent 75%),
                /* Nucleo centrale scuro per staccare i contenuti */
                radial-gradient(circle at 50% 50%, rgba(40, 0, 10, 0.5) 0%, transparent 60%);
            background-color: #010002;
            padding: 20px;
            overflow: hidden;
        }

        /* PALLINI BOKEH ULTRA-LUMINOSI E SPARSI CASUALMENTE */
        .bokeh-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .dot {
            position: absolute;
            border-radius: 50%;
            mix-blend-mode: screen;
            animation: pulseGlow 3s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.7; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1.05); filter: brightness(1.4); }
        }

        .content-box { 
            position: relative; 
            z-index: 2; 
            max-width: 1000px; 
        }

        .brand-subtitle { 
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem; 
            text-transform: uppercase; 
            letter-spacing: 8px; 
            color: #ff8080; 
            margin-bottom: 20px; 
            font-weight: 800;
            text-shadow: 0 0 15px rgba(255, 128, 128, 0.6);
        }

        .selection-title {
            font-family: 'Inter', sans-serif;
            font-size: clamp(3.5rem, 9vw, 8rem); 
            font-weight: 900; 
            line-height: 0.95; 
            letter-spacing: -2px;
            margin-bottom: 25px;
            color: #ffffff;
            text-shadow: 0 0 40px rgba(255, 26, 60, 0.8);
        }

        .selection-subtitle { 
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.1rem, 2vw, 1.4rem); 
            color: #e0e0e0; 
            margin-bottom: 50px; 
            letter-spacing: 1px; 
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
        }

        .buttons-wrapper { 
            display: flex; 
            gap: 30px; 
            justify-content: center; 
            flex-wrap: wrap; 
        }

        .choice-btn {
            font-family: 'Inter', sans-serif;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            width: 280px; 
            padding: 35px 25px; 
            border-radius: 50px; 
            text-decoration: none;
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            transition: all 0.3s ease;
        }

        .btn-creator {
            background: linear-gradient(135deg, #ff1a3c 0%, #ff7700 100%);
            border: 2px solid rgba(255, 26, 60, 0.8); 
            color: #ffffff;
            box-shadow: 
                0 0 35px rgba(255, 26, 60, 0.8),
                0 0 70px rgba(255, 119, 0, 0.6);
        }

        .btn-creator:hover { 
            transform: translateY(-5px) scale(1.05); 
            box-shadow: 
                0 0 50px rgba(255, 26, 60, 1),
                0 0 95px rgba(255, 119, 0, 0.9); 
        }

        .btn-follower {
            background: rgba(20, 20, 25, 0.7); 
            border: 2px solid rgba(255, 255, 255, 0.2); 
            color: #ffffff;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .btn-follower:hover { 
            background: rgba(40, 35, 45, 0.9); 
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-5px) scale(1.05); 
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .choice-btn span { 
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem; 
            color: #ffe082; 
            margin-top: 8px; 
            font-weight: 400; 
            text-transform: none; 
            letter-spacing: 0.5px; 
        }
    </style>
</head>
<body>
    <div class="selection-container">
        <!-- PALLINI BOKEH ULTRA-LUMINOSI E SPARSI CASUALMENTE -->
        <div class="bokeh-container">
            <div class="dot" style="width: 14px; height: 14px; top: 15%; left: 15%; background: #00ffff; box-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff; animation-delay: 0.2s;"></div>
            <div class="dot" style="width: 22px; height: 22px; top: 80%; left: 10%; background: #00bfff; box-shadow: 0 0 20px #00bfff, 0 0 40px #00bfff; animation-delay: 1.1s;"></div>
            <div class="dot" style="width: 20px; height: 20px; top: 20%; left: 85%; background: #ff007f; box-shadow: 0 0 20px #ff007f, 0 0 40px #ff007f; animation-delay: 0.5s;"></div>
            <div class="dot" style="width: 12px; height: 12px; top: 85%; left: 80%; background: #ff80bf; box-shadow: 0 0 14px #ff80bf; animation-delay: 1.3s;"></div>
            <div class="dot" style="width: 8px; height: 8px; top: 10%; left: 50%; background: #ffffff; box-shadow: 0 0 15px #ffffff, 0 0 25px #ffffff; animation-delay: 0.8s;"></div>
            <div class="dot" style="width: 10px; height: 10px; top: 90%; left: 45%; background: #ffffff; box-shadow: 0 0 18px #ffffff; animation-delay: 0.2s;"></div>
            <div class="dot" style="width: 16px; height: 16px; top: 30%; left: 25%; background: #ff00ff; box-shadow: 0 0 18px #ff00ff; animation-delay: 0.6s;"></div>
            <div class="dot" style="width: 14px; height: 14px; top: 70%; left: 75%; background: #00ffff; box-shadow: 0 0 16px #00ffff; animation-delay: 1.4s;"></div>
        </div>

        <div class="content-box">
            <div class="brand-subtitle">New Generation Stars</div>
            <h1 class="selection-title">Welcome to NGS</h1>
            <p class="selection-subtitle">Select your elite access profile to continue</p>
            
            <div class="buttons-wrapper">
                <a href="creator-guida.html" class="choice-btn btn-creator">
                    Creator
                    <span>Discover the elite club & perks</span>
                </a>
                <a href="presentazione-follower.html" class="choice-btn btn-follower">
                    Follower
                    <span>Enter the experience</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
