<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGS - Select Your Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body { 
            background-color: #010002; 
            color: #ffffff; 
            font-family: 'Poppins', sans-serif; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
            position: relative;
        }

        /* SFONDO DINAMICO CON AURE LED ROSSE DAI BORDI VERSO IL CENTRO */
        .selection-container {
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center;
            background: 
                /* LED Rosso da Sinistra verso il centro */
                radial-gradient(ellipse 50% 80% at 0% 50%, rgba(255, 0, 43, 0.85) 0%, rgba(150, 0, 20, 0.4) 40%, transparent 75%),
                /* LED Rosso da Destra verso il centro */
                radial-gradient(ellipse 50% 80% at 100% 50%, rgba(255, 0, 43, 0.85) 0%, rgba(150, 0, 20, 0.4) 40%, transparent 75%),
                /* Nucleo centrale scuro per staccare i contenuti */
                radial-gradient(circle at 50% 50%, rgba(40, 0, 10, 0.5) 0%, transparent 60%);
            background-color: #010002;
            padding: 20px;
            overflow: hidden;
        }

        /* PALLINI BOKEH ULTRA-LUMINOSI E SPARSI CASUALMENTE */
        .bokeh-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .dot {
            position: absolute;
            border-radius: 50%;
            mix-blend-mode: screen;
            animation: pulseGlow 3s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.7; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1.05); filter: brightness(1.4); }
        }

        .content-box { 
            position: relative; 
            z-index: 2; 
            max-width: 1000px; 
        }

        .brand-subtitle { 
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem; 
            text-transform: uppercase; 
            letter-spacing: 8px; 
            color: #ff8080; 
            margin-bottom: 20px; 
            font-weight: 800;
            text-shadow: 0 0 15px rgba(255, 128, 128, 0.6);
        }

        .selection-title {
            font-family: 'Inter', sans-serif;
            font-size: clamp(3.5rem, 9vw, 8rem); 
            font-weight: 900; 
            line-height: 0.95; 
            letter-spacing: -2px;
            margin-bottom: 25px;
            color: #ffffff;
            text-shadow: 0 0 40px rgba(255, 26, 60, 0.8);
        }

        .selection-subtitle { 
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.1rem, 2vw, 1.4rem); 
            color: #e0e0e0; 
            margin-bottom: 50px; 
            letter-spacing: 1px; 
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
        }

        .buttons-wrapper { 
            display: flex; 
            gap: 30px; 
            justify-content: center; 
            flex-wrap: wrap; 
        }

            display: flex
