<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGS — Follower Application</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-red: #ff0033;
            --neon-pink: #ff2a6d;
            --card-bg: rgba(20, 2, 6, 0.88);
            --font-main: 'Montserrat', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 50% 30%, #660019 0%, #2b000b 50%, #080103 100%);
            background-attachment: fixed;
            color: #ffffff;
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            position: relative;
        }

        .form-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 780px;
            background: var(--card-bg);
            border: 2px solid var(--neon-red);
            border-radius: 28px;
            padding: 55px 45px;
            box-shadow: 0 0 35px var(--neon-red), 0 30px 90px rgba(0, 0, 0, 0.95);
        }

        .header-box {
            text-align: center;
            margin-bottom: 45px;
        }

        .main-title {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 900;
            margin-bottom: 18px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.9), 0 0 40px var(--neon-red);
        }

        .header-desc {
            color: #e6e6f2;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .section-header {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            font-weight: 900;
            margin: 40px 0 22px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-header::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, var(--neon-red), transparent);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 0.88rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .input-field {
            width: 100%;
            padding: 18px 22px;
            background: rgba(25, 2, 8, 0.9);
            border: 2px solid #ff1a4d;
            border-radius: 16px;
            color: #ffffff;
            font-size: 0.98rem;
            font-family: var(--font-main);
        }

        .input-field:focus {
            outline: none;
            border-color: #ffffff;
            box-shadow: 0 0 30px #ff0033;
        }

        .card-box {
            background: linear-gradient(145deg, rgba(40, 2, 12, 0.9), rgba(15, 0, 4, 0.95));
            border: 2px solid #ff1a4d;
            border-radius: 20px;
            padding: 30px;
            margin-top: 15px;
            box-shadow: 0 0 30px rgba(255, 0, 51, 0.6);
        }

        .card-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #ff0033 0%, #99001f 100%);
            color: #ffffff;
            border: 2px solid #ff6680;
            padding: 20px 30px;
            font-size: 1.05rem;
            font-weight: 900;
            font-family: var(--font-main);
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 40px var(--neon-red);
            margin-top: 30px;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: scale(1.02);
            box-shadow: 0 0 60px var(--neon-red);
        }

        .checkbox-container {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin: 25px 0;
            cursor: pointer;
        }

        .checkbox-container input {
            width: 20px;
            height: 20px;
            accent-color: var(--neon-red);
            margin-top: 2px;
        }

        .checkbox-label {
            font-size: 0.85rem;
            color: #eeeeee;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="form-card">
        <div class="header-box">
            <h1 class="main-title">Follower Application</h1>
            <p class="header-desc">Registra i tuoi dati e collega il metodo di pagamento in modo sicuro, senza alcun abbonamento o costo nascosto.</p>
        </div>

        <form id="followerForm" action="follower-dashboard.html" method="POST">
            <div class="section-header">1. Dati Personali</div>

            <div class="form-group">
                <label>Nome e Cognome</label>
                <input type="text" id="fullName" class="input-field" placeholder="Inserisci il tuo nome completo" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" class="input-field" placeholder="nome@esempio.com" required>
            </div>

            <div class="section-header">2. Metodo di Pagamento (Registrazione Sicura)</div>

            <div class="card-box">
                <div class="form-group">
                    <label>Numero di Carta</label>
                    <input type="text" id="cardNumber" class="input-field" placeholder="4532 •••• •••• ••••" maxlength="19" required>
                </div>
                <div class="card-row">
                    <div class="form-group">
                        <label>Scadenza (MM/AA)</label>
                        <input type="text" id="cardExp" class="input-field" placeholder="MM/AA" maxlength="5" required>
                    </div>
                    <div class="form-group">
                        <label>CVV</label>
                        <input type="password" id="cardCvv" class="input-field" placeholder="123" maxlength="4" required>
                    </div>
                </div>
            </div>

            <label class="checkbox-container">
                <input type="checkbox" required>
                <span class="checkbox-label">Accetto i termini operativi del club e il protocollo di sicurezza NGS.</span>
            </label>

            <button type="submit" class="btn-submit">Completa Registrazione & Entra</button>
        </form>
    </div>

</body>
</html>
