<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="github-domain-verification" content="11Syd0YXMKot64UIcHyISGGSfOQEas_BiCQV6V77-Ms">
  <meta name="google-site-verification" content="11Syd0YXMKot64UIcHyISGGSfOQEas_BiCQV6V77-Ms" />
  <title>NGS - New Generation Stars</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #010002;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      font-family: 'Poppins', sans-serif;
    }

    .disco-bg {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 1;
      background: 
        radial-gradient(ellipse 50% 80% at 0% 50%, rgba(255, 0, 43, 0.85) 0%, rgba(150, 0, 20, 0.4) 40%, transparent 75%),
        radial-gradient(ellipse 50% 80% at 100% 50%, rgba(255, 0, 43, 0.85) 0%, rgba(150, 0, 20, 0.4) 40%, transparent 75%),
        radial-gradient(circle at 50% 50%, rgba(40, 0, 10, 0.5) 0%, transparent 60%);
      filter: blur(30px);
    }

    .hero-card {
      position: relative;
      z-index: 3;
      text-align: center;
      max-width: 1100px;
      padding: 60px 20px 30px;
      width: 100%;
      margin: auto;
    }

    .title-logo {
      font-family: 'Inter', sans-serif;
      font-size: 10rem;
      font-weight: 900;
      letter-spacing: 14px;
      padding-left: 14px;
      color: #ff1a3c;
      text-shadow: 0 0 60px rgba(255, 26, 60, 1), 0 0 20px rgba(255, 26, 60, 0.8);
      margin-bottom: -10px;
      line-height: 0.9;
      text-transform: uppercase;
    }

    .subtitle {
      font-family: 'Inter', sans-serif;
      color: #ffe082;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 6px;
      padding-left: 6px;
      text-transform: uppercase;
      margin-bottom: 25px;
      text-shadow: 0 0 25px rgba(255, 224, 130, 0.9), 2px 2px 4px rgba(0,0,0,0.9);
    }

    .description {
      color: #ffffff;
      font-size: 1.4rem;
      font-weight: 400;
      line-height: 1.6;
      margin-bottom: 45px;
      text-shadow: 0 2px 15px rgba(0, 0, 0, 0.95);
    }

    .btn-discover {
      font-family: 'Inter', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 24px 62px;
      font-size: 1.55rem;
      font-weight: 800;
      color: #ffffff;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ff1a3c 0%, #ff7700 100%);
      border-radius: 60px;
      box-shadow: 0 0 35px rgba(255, 26, 60, 0.9), 0 0 70px rgba(255, 119, 0, 0.7);
      transition: all 0.3s ease;
    }

    .btn-discover:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 0 55px rgba(255, 26, 60, 1), 0 0 95px rgba(255, 119, 0, 0.9);
    }

    .footer-section {
      position: relative;
      z-index: 3;
      width: 100%;
      padding: 30px 20px;
      text-align: center;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255, 26, 60, 0.2);
      margin-top: 40px;
    }

    .footer-content {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .social-links {
      display: flex;
      gap: 20px;
      margin-bottom: 10px;
    }

    .social-links a {
      color: #ffffff;
      font-size: 1.8rem;
      transition: color 0.3s ease, transform 0.3s ease;
    }

    .social-links a:hover {
      color: #ff1a3c;
      transform: scale(1.2);
    }

    .copyright {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.6);
    }

    @media (max-width: 768px) {
      .title-logo { font-size: 5rem; letter-spacing: 6px; }
      .subtitle { font-size: 1.3rem; letter-spacing: 3px; }
      .description { font-size: 1.1rem; }
      .btn-discover { padding: 18px 40px; font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <div class="disco-bg"></div>

  <main class="hero-card">
    <h1 class="title-logo">NGS</h1>
    <h2 class="subtitle">New Generation Stars</h2>
    <p class="description">
      The platform for new stars. Discover the app and join our community.
    </p>
    <a href="#" class="btn-discover">
      <i class="fa-solid fa-rocket"></i> Discover the App
    </a>
  </main>

  <footer class="footer-section">
    <div class="footer-content">
      <div class="social-links">
        <a href="https://www.instagram.com/ngsnewgenerationstars/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
        <a href="#"><i class="fa-brands fa-tiktok"></i></a>
        <a href="#"><i class="fa-brands fa-youtube"></i></a>
      </div>
      <p class="copyright">&copy; 2026 NGS - New Generation Stars. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
