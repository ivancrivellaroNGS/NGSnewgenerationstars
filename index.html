<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NGS - New Generation Stars</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #010002;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      top: 0px !important;
    }

    /* SFONDO CON AURE LED ROSSE POTENTI DAI BORDI VERSO IL CENTRO */
    .disco-bg {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 1;
      background: 
        radial-gradient(ellipse 50% 80% at 0% 50%, rgba(255, 0, 43, 0.85) 0%, rgba(150, 0, 20, 0.4) 40%, transparent 75%),
        radial-gradient(ellipse 50% 80% at 100% 50%, rgba(255, 0, 43, 0.85) 0%, rgba(150, 0, 20, 0.4) 40%, transparent 75%),
        radial-gradient(circle at 50% 50%, rgba(40, 0, 10, 0.5) 0%, transparent 60%);
      filter: blur(30px);
    }

    /* CONTENITORE PALLINI BOKEH LUMINOSI E SPARSI IN MODO CASUALE */
    .bokeh-container {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 2;
      pointer-events: none;
    }

    .dot {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: screen;
      animation: pulseGlow 3s infinite alternate ease-in-out;
    }

    @keyframes pulseGlow {
      0% { opacity: 0.7; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1.05); filter: brightness(1.4); }
    }

    /* CONTENUTO CENTRALE */
    .hero-card {
      position: relative;
      z-index: 3;
      text-align: center;
      max-width: 1100px;
      padding: 40px 20px;
      width: 100%;
      margin: auto;
    }

    /* LOGO NGS PULITO, ROSSO PIENO E CENTRATO TRA I LED */
    .title-logo {
      font-family: 'Inter', sans-serif;
      font-size: 12rem;
      font-weight: 900;
      letter-spacing: 14px;
      padding-left: 14px;
      color: #ff1a3c;
      background: none;
      -webkit-background-clip: initial;
      -webkit-text-fill-color: #ff1a3c;
      -webkit-text-stroke: 0px;
      text-shadow: 0 0 60px rgba(255, 26, 60, 1), 0 0 20px rgba(255, 26, 60, 0.8);
      margin-bottom: -10px;
      line-height: 0.9;
      text-transform: uppercase;
    }

    /* SUBTITLE */
    .subtitle {
      font-family: 'Inter', sans-serif;
      color: #ffe082;
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 6px;
      padding-left: 6px;
      text-transform: uppercase;
      margin-bottom: 25px;
      text-shadow: 0 0 25px rgba(255, 224, 130, 0.9), 2px 2px 4px rgba(0,0,0,0.9);
    }

    /* DESCRIZIONE */
    .description {
      font-family: 'Poppins', sans-serif;
      color: #ffffff;
      font-size: 1.6rem;
      font-weight: 400;
      line-height: 1.6;
      margin-bottom: 25px;
      text-shadow: 0 2px 15px rgba(0, 0, 0, 0.95);
    }

    /* STILE SELETTORE TRADUZIONE GOOGLE VISIBILE E PULITO */
    .translate-wrapper {
      margin-bottom: 35px;
      display: inline-block;
      z-index: 10;
      position: relative;
    }

    .goog-te-combo {
      background: rgba(18, 0, 2, 0.9);
      color: #ffffff;
      border: 1px solid #ff0033;
      padding: 10px 15px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      border-radius: 20px;
      outline: none;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 0, 51, 0.4);
    }

    .goog-te-combo option {
      background: #120002;
      color: #ffffff;
    }

    .goog-te-banner-frame {
      display: none !important;
    }

    /* PULSANTE DISCOVER THE APP */
    .btn-discover {
      font-family: 'Inter', sans-serif;
      display: inline-block;
      padding: 24px 62px;
      font-size: 1.55rem;
      font-weight: 800;
      color: #ffffff;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ff1a3c 0%, #ff7700 100%);
      border-radius: 60px;
      box-shadow: 
        0 0 35px rgba(255, 26, 60, 0.9),
        0 0 70px rgba(255, 119, 0, 0.7);
      transition: all 0.3s ease;
    }

    .btn-discover:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 
        0 0 55px rgba(255, 26, 60, 1),
        0 0 95px rgba(255, 119, 0, 0.9);
    }

    /* FOOTER */
    .footer-section {
      position: relative;
      z-index: 3;
      width: 100%;
      background: rgba(18, 0, 2, 0.85);
      border-top: 1px solid rgba(255, 0, 51, 0.4);
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      backdrop-filter: blur(10px);
    }

    .footer-content {
      max-width: 1100px;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .footer-info {
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      color: #ff99b3;
      line-height: 1.5;
    }

    .footer-info strong {
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .social-links {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .social-icon {
      width: 42px;
      height: 42px;
      background: #240005;
      border: 1px solid #ff0033;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      box-shadow: 0 0 8px rgba(255, 0, 51, 0.3);
      transition: all 0.3s ease;
    }

    .social-icon svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
      transition: fill 0.3s ease;
    }

    .social-icon:hover {
      background: #ff0033;
      transform: translateY(-3px);
      box-shadow: 0 0 15px rgba(255, 0, 51, 0.8);
    }

    .footer-legal {
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.7);
      display: flex;
      gap: 15px;
      margin-top: 5px;
    }

    .footer-legal a {
      color: #ff99b3;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-legal a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    .footer-bottom-bar {
      font-family: 'Poppins', sans-serif;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
      border-top: 1px solid rgba(255, 0, 51, 0.15);
      width: 100%;
      padding-top: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* COOKIE BANNER STYLE */
    #cookie-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(18, 0, 2, 0.98);
      border-top: 2px solid #ff0033;
      padding: 20px;
      z-index: 999999;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 -5px 30px rgba(255, 0, 51, 0.6);
      backdrop-filter: blur(10px);
    }

    .cookie-content {
      max-width: 1100px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .cookie-text {
      font-family: 'Poppins', sans-serif;
      color: #ffffff;
      font-size: 0.9rem;
      line-height: 1.4;
      flex: 1;
    }

    .cookie-text a {
      color: #ff3355;
      text-decoration: underline;
    }

    .cookie-btn {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #ff1a3c 0%, #ff7700 100%);
      color: #ffffff;
      border: none;
      padding: 12px 30px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 26, 60, 0.6);
      transition: all 0.3s ease;
    }

    .cookie-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(255, 26, 60, 0.9);
    }

    @media (max-width: 768px) {
      .title-logo { font-size: 7rem; letter-spacing: 8px; }
      .subtitle { font-size: 1.5rem; }
      .description { font-size: 1.1rem; }
      .footer-content { flex-direction: column; text-align: center; }
      .cookie-content { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- BANNER COOKIE -->

    <div class="cookie-content">
      <div class="cookie-text">
        We use cookies to ensure you get the best experience on our website. By continuing to visit this site, you agree to our use of cookies. Read our <a href="#privacy">Privacy Policy</a> & <a href="#cookie">Cookie Policy</a>.
      </div>
      <button class="cookie-btn" onclick="acceptCookies()">Accept</button>

  </div>

  <div class="disco-bg"></div>
