<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NGS - New Generation Stars</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #010002;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      top: 0px !important;
    }

    /* SFONDO CON AURE LED ROSSE POTENTI DAI BORDI VERSO IL CENTRO */
    .disco-bg {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 1;
      background: 
        /* LED Rosso da Sinistra verso il centro */
        radial-gradient(ellipse 50% 80% at 0% 50%, rgba(255, 0, 43, 0.85) 0%, rgba(150, 0, 20, 0.4) 40%, transparent 75%),
        /* LED Rosso da Destra verso il centro */
        radial-gradient(ellipse 50% 80% at 100% 50%, rgba(255, 0, 43, 0.85) 0%, rgba(150, 0, 20, 0.4) 40%, transparent 75%),
        /* Nucleo centrale scuro per staccare il logo */
        radial-gradient(circle at 50% 50%, rgba(40, 0, 10, 0.5) 0%, transparent 60%);
      filter: blur(30px);
    }

    /* CONTENITORE PALLINI BOKEH LUMINOSI E SPARSI IN MODO CASUALE */
    .bokeh-container {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 2;
      pointer-events: none;
    }

    .dot {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: screen;
      animation: pulseGlow 3s infinite alternate ease-in-out;
    }

    /* EFFETTO LUMINOSITÀ VIVA PER I PALLINI */
    @keyframes pulseGlow {
      0% { opacity: 0.7; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1.05); filter: brightness(1.4); }
    }

    /* CONTENUTO CENTRALE */
    .hero-card {
      position: relative;
      z-index: 3;
      text-align: center;
      max-width: 1100px;
      padding: 40px 20px;
      width: 100%;
      margin: auto;
    }

    /* LOGO NGS PULITO, ROSSO PIENO E CENTRATO TRA I LED */
    .title-logo {
      font-family: 'Inter', sans-serif;
      font-size: 12rem;
      font-weight: 900;
      letter-spacing: 14px;
      padding-left: 14px;
      color: #ff1a3c;
      background: none;
      -webkit-background-clip: initial;
      -webkit-text-fill-color: #ff1a3c;
      -webkit-text-stroke: 0px;
      text-shadow: 0 0 60px rgba(255, 26, 60, 1), 0 0 20px rgba(255, 26, 60, 0.8);
      margin-bottom: -10px;
      line-height: 0.9;
      text-transform: uppercase;
    }

    /* SUBTITLE */
    .subtitle {
      font-family: 'Inter', sans-serif;
      color: #ffe082;
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 6px;
      padding-left: 6px;
      text-transform: uppercase;
      margin-bottom: 25px;
      text-shadow: 0 0 25px rgba(255, 224, 130, 0.9), 2px 2px 4px rgba(0,0,0,0.9);
    }

    /* DESCRIZIONE */
    .description {
      font-family: 'Poppins', sans-serif;
      color: #ffffff;
      font-size: 1.6rem;
      font-weight: 400;
      line-height: 1.6;
      margin-bottom: 25px;
      text-shadow: 0 2px 15px rgba(0, 0, 0, 0.95);
    }

    /* STILE SELETTORE TRADUZIONE GOOGLE VISIBILE E PULITO */
    .translate-wrapper {
      margin-bottom: 35px;
      display: inline-block;
      z-index: 99999;
      position: relative;
    }

    .goog-te-combo {
      background: rgba(18, 0, 2, 0.95);
      color: #ffffff;
      border: 1px solid #ff0033;
      padding: 10px 15px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      border-radius: 20px;
      outline: none;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 51, 0.6);
    }

    .goog-te-combo option {
      background: #120002;
      color: #ffffff;
    }

    /* Nasconde il fastidioso banner in alto di Google Traduttore e previene shift pagina */
    .goog-te-banner-frame {
      display: none !important;
    }

    .goog-tooltip {
      display: none !important;
    }

    .goog-tooltip:hover {
      display: none !important;
    }

    .goog-text-highlight {
      background-color: transparent !important;
      box-shadow: none !important;
    }

    /* PULSANTE DISCOVER THE APP */
    .btn-discover {
      font-family: 'Inter', sans-serif;
      display: inline-block;
      padding: 24px 62px;
      font-size: 1.
