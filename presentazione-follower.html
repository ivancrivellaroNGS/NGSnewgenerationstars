<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGS — Member Guide & Presentation | New Generation Stars</title>

    <style>
        :root {
            --bg-radial: radial-gradient(circle at center, #730019 0%, #120002 100%);
            --card-bg-1: #240005;
            --card-bg-2: #330009;
            --card-bg-3: #3b000b;
            --neon-red: #ff0033;
            --neon-green: #00ff66;
            --neon-glow: 0 0 15px rgba(255, 0, 51, 0.4);
            --neon-glow-strong: 0 0 25px rgba(255, 0, 51, 0.8);
            --green-glow: 0 0 15px rgba(0, 255, 102, 0.4);
            --text-glow: 0 0 10px #ff0033;
            --font-main: 'Montserrat', sans-serif;
            --font-title: 'Playfair Display', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-radial);
            background-attachment: fixed;
            color: #ffffff;
            font-family: var(--font-main);
            min-height: 100vh;
            line-height: 1.7;
            overflow-x: hidden;
            padding-bottom: 60px;
        }

        .page-wrapper {
            position: relative;
            padding: 50px 20px 80px 20px;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 900px;
            margin: 0 auto;
        }

        /* TOP BAR */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .nav-back {
            display: inline-flex;
            align-items: center;
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-size: 0.85rem;
            padding: 8px 18px;
            background: var(--card-bg-1);
            border: 1px solid rgba(255, 0, 51, 0.4);
            border-radius: 50px;
            box-shadow: var(--neon-glow);
            transition: all 0.3s ease;
        }

        .nav-back:hover {
            color: var(--neon-red);
            border-color: var(--neon-red);
            box-shadow: var(--neon-glow-strong);
            transform: translateX(-3px);
        }

        .badge-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .badge-item {
            background: var(--card-bg-1);
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1px;
            box-shadow: var(--neon-glow);
            text-transform: uppercase;
        }

        /* HEADER */
        .guide-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .guide-subtitle-top {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--neon-red);
            margin-bottom: 12px;
            font-weight: 800;
            text-shadow: var(--text-glow);
        }

        .guide-title {
            font-family: var(--font-title);
            font-size: clamp(2.2rem, 4.5vw, 3.5rem);
            font-weight: 700;
            line-height: 1.2;
            color: #ffffff;
            margin-bottom: 20px;
        }

        .guide-title span {
            color: var(--neon-red);
            text-shadow: var(--text-glow);
        }

        .guide-intro {
            color: #cccccc;
            font-size: 1.05rem;
            font-weight: 300;
            max-width: 750px;
            margin: 0 auto;
        }

        .guide-content {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-bottom: 50px;
        }
